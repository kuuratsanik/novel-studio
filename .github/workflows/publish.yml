name: Publish
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  vsce:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Publish to the Visual Studio Marketplace
        # Passed via the environment so the token never appears in a command line.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish
